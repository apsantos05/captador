<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxo do Captador</title>
<style>
  :root {
    --bg:#f7f7f4; --card:#ffffff; --tx:#1d2330; --mut:#5d6675; --ar:#5b6472;
    --lane1:#eef3fd; --lane2:#f3f0fb; --lane3:#ecf7f5;
    --cor:#2f6fdb; --sys:#7a4fd6; --ext:#0f8f86; --dec:#c07a00; --bad:#c0334d; --ok:#2e8a3e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#14171c; --card:#1d2129; --tx:#e8eaee; --mut:#9aa3b2; --ar:#8b93a1;
      --lane1:#18202e; --lane2:#1f1a2c; --lane3:#15241f;
      --cor:#6d9cf0; --sys:#a88af0; --ext:#3cc0b5; --dec:#e6a73a; --bad:#ef6b83; --ok:#5cc26d;
    }
  }
  :root[data-theme="dark"] {
    --bg:#14171c; --card:#1d2129; --tx:#e8eaee; --mut:#9aa3b2; --ar:#8b93a1;
    --lane1:#18202e; --lane2:#1f1a2c; --lane3:#15241f;
    --cor:#6d9cf0; --sys:#a88af0; --ext:#3cc0b5; --dec:#e6a73a; --bad:#ef6b83; --ok:#5cc26d;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:system-ui, "Segoe UI", sans-serif; }
  header { max-width:1200px; margin:0 auto; padding:24px 16px 0; }
  h1 { margin:0; font-size:22px; }
  header p { margin:4px 0 0; color:var(--mut); font-size:14px; }
  .wrap { max-width:1200px; margin:0 auto; padding:8px 16px 24px; overflow-x:auto; }
  svg { width:100%; min-width:860px; height:auto; display:block; }
  .lh { font-size:16px; font-weight:700; }
  .n { fill:var(--card); stroke-width:2; }
  .tx { font-size:14px; fill:var(--tx); }
  .sm { font-size:12px; fill:var(--mut); }
  .num { font-size:12px; font-weight:700; fill:#fff; }
  .a { fill:none; stroke:var(--ar); stroke-width:2; }
  .d { stroke-dasharray:6 5; }
  .lb { font-size:12.5px; font-weight:700; }
</style>
</head>
<body>
<header>
  <h1>Fluxo do Captador: do endereço ao contato do proprietário</h1>
  <p>Três raias: o que o corretor faz, o que o sistema faz e quais fontes externas são consultadas. Custos são estimativas.</p>
</header>
<div class="wrap">
<svg viewBox="0 0 1200 1110" role="img" aria-label="Fluxograma do Captador em três raias">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--ar)"/>
    </marker>
  </defs>

  <!-- Raias -->
  <rect x="0" y="0" width="300" height="1110" style="fill:var(--lane1)"/>
  <rect x="300" y="0" width="500" height="1110" style="fill:var(--lane2)"/>
  <rect x="800" y="0" width="400" height="1110" style="fill:var(--lane3)"/>
  <text x="150" y="40" text-anchor="middle" class="lh" style="fill:var(--cor)">👤 Corretor</text>
  <text x="550" y="40" text-anchor="middle" class="lh" style="fill:var(--sys)">⚙️ Sistema Captador</text>
  <text x="1000" y="40" text-anchor="middle" class="lh" style="fill:var(--ext)">🌐 Fontes externas</text>

  <!-- ===== Setas ===== -->
  <path class="a" marker-end="url(#ah)" d="M270,110 H398"/>
  <path class="a" marker-start="url(#ah)" marker-end="url(#ah)" d="M702,110 H848"/>
  <path class="a" marker-end="url(#ah)" d="M550,140 V173"/>
  <!-- Sim: já na base → direto ao card -->
  <path class="a" marker-end="url(#ah)" d="M400,220 H320 V900 H272"/>
  <text x="326" y="210" class="lb" style="fill:var(--ok)">SIM</text>
  <text x="312" y="480" class="lb" style="fill:var(--ok)" transform="rotate(-90 312 480)">resposta na hora (custo zero)</text>
  <!-- Não → bureau -->
  <path class="a" marker-end="url(#ah)" d="M550,265 V308"/>
  <text x="560" y="292" class="lb" style="fill:var(--bad)">NÃO</text>
  <path class="a" marker-start="url(#ah)" marker-end="url(#ah)" d="M702,340 H848"/>
  <path class="a" marker-end="url(#ah)" d="M550,370 V418"/>
  <path class="a" marker-start="url(#ah)" marker-end="url(#ah)" d="M702,450 H848"/>
  <path class="a" marker-end="url(#ah)" d="M550,480 V528"/>
  <path class="a" marker-end="url(#ah)" d="M550,590 V628"/>
  <!-- Lead frio → salva -->
  <path class="a" marker-end="url(#ah)" d="M400,675 H360 V862 H440 V883"/>
  <text x="366" y="665" class="lb" style="fill:var(--bad)">NÃO</text>
  <!-- Lead quente → matrícula -->
  <path class="a" marker-end="url(#ah)" d="M550,720 V763"/>
  <text x="560" y="748" class="lb" style="fill:var(--ok)">SIM</text>
  <path class="a" marker-start="url(#ah)" marker-end="url(#ah)" d="M702,810 H848"/>
  <!-- Dono ≠ morador → volta para buscar contatos do dono -->
  <path class="a d" marker-end="url(#ah)" d="M700,780 H770 V465 H704"/>
  <text x="794" y="640" class="lb" style="fill:var(--dec)" transform="rotate(-90 794 640)">dono ≠ morador → contatos do dono</text>
  <path class="a" marker-end="url(#ah)" d="M550,825 V883"/>
  <path class="a" marker-end="url(#ah)" d="M400,930 H272"/>
  <path class="a" marker-end="url(#ah)" d="M150,945 V1003"/>
  <path class="a" marker-end="url(#ah)" d="M270,1035 H398"/>

  <!-- ===== Nós ===== -->
  <!-- C1 -->
  <rect class="n" x="30" y="80" width="240" height="60" rx="12" style="stroke:var(--cor)"/>
  <circle cx="30" cy="80" r="11" style="fill:var(--cor)"/><text x="30" y="84" text-anchor="middle" class="num">1</text>
  <text x="150" y="106" text-anchor="middle" class="tx">Digita CEP + número</text>
  <text x="150" y="124" text-anchor="middle" class="sm">e escolhe a finalidade</text>

  <!-- S1 -->
  <rect class="n" x="400" y="80" width="300" height="60" rx="12" style="stroke:var(--sys)"/>
  <circle cx="400" cy="80" r="11" style="fill:var(--sys)"/><text x="400" y="84" text-anchor="middle" class="num">2</text>
  <text x="550" y="106" text-anchor="middle" class="tx">Padroniza o endereço</text>
  <text x="550" y="124" text-anchor="middle" class="sm">rua, bairro, cidade a partir do CEP</text>
  <!-- F1 -->
  <rect class="n" x="850" y="80" width="300" height="60" rx="12" style="stroke:var(--ext)"/>
  <text x="1000" y="106" text-anchor="middle" class="tx">ViaCEP</text>
  <text x="1000" y="124" text-anchor="middle" class="sm">gratuito</text>

  <!-- S2 decisão -->
  <polygon class="n" points="550,175 700,220 550,265 400,220" style="stroke:var(--dec)"/>
  <text x="550" y="216" text-anchor="middle" class="tx">Já está na</text>
  <text x="550" y="234" text-anchor="middle" class="tx">base própria?</text>

  <!-- S3 -->
  <rect class="n" x="400" y="310" width="300" height="60" rx="12" style="stroke:var(--sys)"/>
  <circle cx="400" cy="310" r="11" style="fill:var(--sys)"/><text x="400" y="314" text-anchor="middle" class="num">3</text>
  <text x="550" y="336" text-anchor="middle" class="tx">Descobre quem mora no endereço</text>
  <text x="550" y="354" text-anchor="middle" class="sm">nome + CPF dos vinculados</text>
  <!-- F3 -->
  <rect class="n" x="850" y="310" width="300" height="60" rx="12" style="stroke:var(--ext)"/>
  <text x="1000" y="336" text-anchor="middle" class="tx">Bureau licenciado · busca endereço</text>
  <text x="1000" y="354" text-anchor="middle" class="sm">~R$ 0,30–3 por consulta</text>

  <!-- S4 -->
  <rect class="n" x="400" y="420" width="300" height="60" rx="12" style="stroke:var(--sys)"/>
  <circle cx="400" cy="420" r="11" style="fill:var(--sys)"/><text x="400" y="424" text-anchor="middle" class="num">4</text>
  <text x="550" y="446" text-anchor="middle" class="tx">Busca telefones do CPF</text>
  <text x="550" y="464" text-anchor="middle" class="sm">1 vez por CPF, depois fica em cache</text>
  <!-- F4 -->
  <rect class="n" x="850" y="420" width="300" height="60" rx="12" style="stroke:var(--ext)"/>
  <text x="1000" y="446" text-anchor="middle" class="tx">Bureau · telefones e WhatsApp</text>
  <text x="1000" y="464" text-anchor="middle" class="sm">BigDataCorp, Assertiva, Procob…</text>

  <!-- S5 -->
  <rect class="n" x="400" y="530" width="300" height="60" rx="12" style="stroke:var(--sys)"/>
  <circle cx="400" cy="530" r="11" style="fill:var(--sys)"/><text x="400" y="534" text-anchor="middle" class="num">5</text>
  <text x="550" y="556" text-anchor="middle" class="tx">Remove opt-out + grava log LGPD</text>
  <text x="550" y="574" text-anchor="middle" class="sm">quem consultou, quando e para quê</text>

  <!-- S6 decisão -->
  <polygon class="n" points="550,630 700,675 550,720 400,675" style="stroke:var(--dec)"/>
  <text x="550" y="671" text-anchor="middle" class="tx">Lead quente?</text>
  <text x="550" y="689" text-anchor="middle" class="tx">Confirmar dono</text>

  <!-- S7 -->
  <rect class="n" x="400" y="765" width="300" height="60" rx="12" style="stroke:var(--sys)"/>
  <circle cx="400" cy="765" r="11" style="fill:var(--sys)"/><text x="400" y="769" text-anchor="middle" class="num">6</text>
  <text x="550" y="791" text-anchor="middle" class="tx">Lê a matrícula: morador = dono?</text>
  <text x="550" y="809" text-anchor="middle" class="sm">extrai nome + CPF do último registro</text>
  <!-- F7 -->
  <rect class="n" x="850" y="780" width="300" height="60" rx="12" style="stroke:var(--ext)"/>
  <text x="1000" y="806" text-anchor="middle" class="tx">RI Digital via Infosimples</text>
  <text x="1000" y="824" text-anchor="middle" class="sm">PDF da matrícula · ~R$ 20–90</text>

  <!-- S8 -->
  <rect class="n" x="400" y="885" width="300" height="60" rx="12" style="stroke:var(--sys)"/>
  <circle cx="400" cy="885" r="11" style="fill:var(--sys)"/><text x="400" y="889" text-anchor="middle" class="num">7</text>
  <text x="550" y="911" text-anchor="middle" class="tx">Salva na base própria</text>
  <text x="550" y="929" text-anchor="middle" class="sm">endereço ↔ dono ↔ contatos</text>

  <!-- C8 -->
  <rect class="n" x="30" y="885" width="240" height="60" rx="12" style="stroke:var(--cor)"/>
  <circle cx="30" cy="885" r="11" style="fill:var(--cor)"/><text x="30" y="889" text-anchor="middle" class="num">8</text>
  <text x="150" y="911" text-anchor="middle" class="tx">Recebe o card</text>
  <text x="150" y="929" text-anchor="middle" class="sm">nome · telefones · WhatsApp</text>

  <!-- C9 -->
  <rect class="n" x="30" y="1005" width="240" height="60" rx="12" style="stroke:var(--cor)"/>
  <circle cx="30" cy="1005" r="11" style="fill:var(--cor)"/><text x="30" y="1009" text-anchor="middle" class="num">9</text>
  <text x="150" y="1031" text-anchor="middle" class="tx">Aborda e registra</text>
  <text x="150" y="1049" text-anchor="middle" class="sm">agendou · captou · não contatar</text>

  <!-- S9 -->
  <rect class="n" x="400" y="1005" width="300" height="60" rx="12" style="stroke:var(--sys)"/>
  <circle cx="400" cy="1005" r="11" style="fill:var(--sys)"/><text x="400" y="1009" text-anchor="middle" class="num">10</text>
  <text x="550" y="1031" text-anchor="middle" class="tx">Funil + relatório + opt-out</text>
  <text x="550" y="1049" text-anchor="middle" class="sm">"não contatar" bloqueia no passo 5</text>
</svg>
</div>
</body>
</html>
