services:
  - type: web
    name: captador
    runtime: python
    plan: free
    rootDir: captador
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEMO_MODE
        value: "1"
      - key: COOKIE_SEGURO
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: CAPTADOR_DB
        value: /tmp/captador.db
